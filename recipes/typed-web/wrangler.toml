name = "mantle-blank"
main = "src/index.ts"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[observability]
enabled = true
head_sampling_rate = 1

[cache]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Post-deploy provisioning writes PUBLIC_ORIGIN and the chosen auth
# client metadata here. Secrets stay in Cloudflare via `wrangler secret put`.
#
MANTLE_AUTH_MODE = "{{AUTH_MODE}}"
#
# Mantle Hosted Auth (public PKCE client; no client secret):
# MANTLE_HOSTED_AUTH_ISSUER = "https://auth.mantle.tools"
# MANTLE_HOSTED_AUTH_CLIENT_ID = "https://auth.mantle.tools/clients/<site-id>"
#
# Self-hosted GitHub OAuth fallback:
# GITHUB_CLIENT_ID = "..."
# ADMIN_GITHUB_LOGIN = "..."
#
# Optional contact protection:
# TURNSTILE_SITE_KEY = "0x..."
# Set BETTER_AUTH_SECRET and optional TURNSTILE_SECRET_KEY with
# `wrangler secret put`.

[[d1_databases]]
binding = "DB"
database_name = "mantle-blank-local"
# Omit database_id in generated projects so Cloudflare's first Git
# deploy can auto-provision the D1 database.

# Bundle YAML manifests as inline text strings.
[[rules]]
type = "Text"
globs = ["**/*.yaml"]
fallthrough = true
