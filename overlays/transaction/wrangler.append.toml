
# Optional product media. Leave commented for the zero-R2 first run;
# follow .mantle/overlays/transaction/handoff.md when enabling uploads.
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "{{PROJECT_NAME}}-media"

# Transaction inventory authority and abandoned-checkout cleanup.
[[durable_objects.bindings]]
name = "INVENTORY_COORDINATOR"
class_name = "InventoryCoordinator"

[[migrations]]
tag = "transaction-inventory-v1"
new_sqlite_classes = ["InventoryCoordinator"]

[[queues.producers]]
binding = "ORDER_EXPIRY_QUEUE"
queue = "{{PROJECT_NAME}}-order-expiry"

[[queues.consumers]]
queue = "{{PROJECT_NAME}}-order-expiry"
max_concurrency = 1
max_batch_size = 10
max_retries = 5
retry_delay = 30
dead_letter_queue = "{{PROJECT_NAME}}-order-expiry-dlq"

[triggers]
crons = ["*/5 * * * *"]
