apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: page
spec:
  title: Pages
  description: Stable page identities shared by every language version.
  schema:
    type: object
    required: [slug, type]
    properties:
      slug:
        type: string
        pattern: "^[a-z0-9-]+$"
      type:
        type: string
        enum: [home, page]
  uniqueIndexes:
    - [slug]
  localized: false
  lifecycle: publishing
---
apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: page-translations
spec:
  title: Page translations
  description: Localized page copy and sections.
  localized: true
  translates:
    parent: page
    on: slug
  schema:
    type: object
    required: [slug, locale, title, sections]
    properties:
      slug:
        type: string
        pattern: "^[a-z0-9-]+$"
      locale:
        type: string
      title: { type: string }
      summary: { type: string }
      sections:
        type: array
        minItems: 1
        items:
          type: object
          required: [type, title]
          properties:
            type:
              type: string
              enum: [hero, features, content, faq, cta]
            id: { type: string }
            eyebrow: { type: string }
            title: { type: string }
            body:
              type: string
              x-mcp-hint: markdown
            showImage: { type: boolean }
            image:
              type: object
              required: [src, alt]
              properties:
                src: { type: string }
                alt: { type: string }
            action:
              type: object
              properties:
                label: { type: string }
                href: { type: string }
            secondaryAction:
              type: object
              properties:
                label: { type: string }
                href: { type: string }
            items:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  body:
                    type: string
                    x-mcp-hint: markdown
                  icon: { type: string }
  uniqueIndexes:
    - [slug, locale]
  indexes:
    - [locale, slug]
  lifecycle: publishing
---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: home
spec:
  from: page-translations
  params:
    type: object
    additionalProperties: false
    required: [locale]
    properties:
      locale: { type: string }
  fields: [id, slug, locale, title, summary, sections, updatedAt]
  filter:
    and:
      - eq: { field: status, value: published }
      - eq: { field: slug, value: home }
      - eq: { field: locale, value: { $param: locale } }
  limit: 1
---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: public-pages
spec:
  surface: public
  from: page-translations
  params:
    type: object
    additionalProperties: false
    required: [locale]
    properties:
      locale: { type: string }
  fields: [id, slug, locale, title, summary, sections, updatedAt]
  filter:
    and:
      - eq: { field: status, value: published }
      - eq: { field: locale, value: { $param: locale } }
  orderBy:
    - { field: slug, direction: asc }
  limit: 100
---
apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: products
spec:
  title: Products
  description: Stable product identity, price, and media shared by every language version.
  schema:
    type: object
    required: [slug, priceMinor, currency]
    properties:
      slug:
        type: string
        pattern: "^[a-z0-9-]+$"
      priceMinor:
        type: integer
        minimum: 0
      currency:
        type: string
        pattern: "^[A-Z]{3}$"
      coverAssetId:
        type: string
        x-mcp-hint: media-image
  uniqueIndexes:
    - [slug]
  localized: false
  lifecycle: publishing
---
apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: product-translations
spec:
  title: Product translations
  description: Localized product titles and summaries.
  localized: true
  translates:
    parent: products
    on: slug
  schema:
    type: object
    required: [slug, locale, title]
    properties:
      slug:
        type: string
        pattern: "^[a-z0-9-]+$"
      locale:
        type: string
      title: { type: string }
      summary: { type: string }
  uniqueIndexes:
    - [slug, locale]
  indexes:
    - [locale, slug]
  lifecycle: publishing
---
apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: product-inquiries
spec:
  title: Product inquiries
  description: Operational purchase intent captured live, without draft or publish states. Replace with checkout later.
  schema:
    type: object
    required: [productId, email]
    properties:
      productId:
        type: string
        x-mantle-ref: products
      email:
        type: string
        format: email
      note:
        type: string
      createdAt:
        type: number
        x-mantle-bind: now
  lifecycle: operational
  indexes:
    - [productId]
---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: public-products
spec:
  surface: public
  from: product-translations
  params:
    type: object
    additionalProperties: false
    required: [locale]
    properties:
      locale: { type: string }
  fields: [id, slug, locale, title, summary, updatedAt]
  filter:
    and:
      - eq: { field: status, value: published }
      - eq: { field: locale, value: { $param: locale } }
  orderBy:
    - { field: slug, direction: asc }
  limit: 100
---
apiVersion: cms.mantle.aotter.net/v1
kind: Procedure
metadata:
  name: submit-product-inquiry
spec:
  input:
    type: object
    additionalProperties: false
    required: [productId, email]
    properties:
      productId: { type: string, x-mantle-ref: products }
      email: { type: string, format: email }
      note: { type: string }
  output:
    type: object
  handler:
    kind: builtin
    op: create
    schema: product-inquiries
---
apiVersion: cms.mantle.aotter.net/v1
kind: Trigger
metadata:
  name: submit-product-inquiry-http
spec:
  source:
    kind: http
    method: POST
    path: /api/product-inquiries
  target:
    procedure: submit-product-inquiry
