apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: page
spec:
  title: Pages
  description: Public page content for a community site.
  schema:
    type: object
    required: [type, title, sections]
    properties:
      type:
        type: string
        enum: [home]
      title:
        type: string
      summary:
        type: string
      sections:
        type: array
        minItems: 1
        items:
          type: object
          required: [type, title]
          properties:
            type:
              type: string
              enum: [hero, features, cta]
            id: { type: string }
            eyebrow: { type: string }
            title: { type: string }
            body:
              type: string
              x-mcp-hint: markdown
            showImage: { type: boolean }
            image:
              type: object
              required: [src, alt]
              properties:
                src: { type: string }
                alt: { type: string }
            action:
              type: object
              properties:
                label: { type: string }
                href: { type: string }
            secondaryAction:
              type: object
              properties:
                label: { type: string }
                href: { type: string }
            items:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  body:
                    type: string
                    x-mcp-hint: markdown
                  icon: { type: string }
  uniqueIndexes:
    - [type]
  localized: false
  lifecycle: publishing
---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: home
spec:
  from: page
  fields: [id, type, title, summary, sections, updatedAt]
  filter:
    eq: { field: status, value: published }
  limit: 1
---
apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: community-updates
spec:
  title: Community updates
  description: Public updates or activity notes for a community site.
  schema:
    type: object
    required: [slug, title, publishedAt]
    properties:
      slug:
        type: string
        pattern: "^[a-z0-9-]+$"
      title:
        type: string
      body:
        type: string
        x-mcp-hint: markdown
      publishedAt:
        type: number
        x-mcp-hint: timestamp-ms
  uniqueIndexes:
    - [slug]
  indexes:
    - [publishedAt, slug]
  localized: false
  lifecycle: publishing
---
apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: community-signups
spec:
  title: Community signups
  description: Lightweight interest capture for joining or volunteering.
  schema:
    type: object
    required: [name, email]
    properties:
      name:
        type: string
      email:
        type: string
        format: email
      interest:
        type: string
      createdAt:
        type: integer
        x-mcp-hint: timestamp-ms
        x-mantle-bind: now
  lifecycle: operational
---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: public-community-updates
spec:
  from: community-updates
  fields: [id, slug, title, body, publishedAt, updatedAt]
  filter:
    and:
      - eq: { field: status, value: published }
      - gte: { field: publishedAt, value: 0 }
  orderBy:
    - { field: publishedAt, direction: desc }
    - { field: slug, direction: desc }
  limit: 50
---
apiVersion: cms.mantle.aotter.net/v1
kind: Procedure
metadata:
  name: submit-community-signup
spec:
  input:
    type: object
    additionalProperties: false
    required: [name, email]
    properties:
      name: { type: string }
      email: { type: string, format: email }
      interest: { type: string }
  output:
    type: object
  handler:
    kind: builtin
    op: create
    schema: community-signups
---
apiVersion: cms.mantle.aotter.net/v1
kind: Trigger
metadata:
  name: submit-community-signup-http
spec:
  source:
    kind: http
    method: POST
    path: /api/community-signups
  target:
    procedure: submit-community-signup
