apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: page
spec:
  title: Pages
  description: Public page content for a reservation site.
  schema:
    type: object
    required: [type, title, sections]
    properties:
      type:
        type: string
        enum: [home]
      title: { type: string }
      summary: { type: string }
      sections:
        type: array
        minItems: 1
        items:
          type: object
          required: [type, title]
          properties:
            type:
              type: string
              enum: [hero, features, form]
            id: { type: string }
            eyebrow: { type: string }
            title: { type: string }
            body:
              type: string
              x-mcp-hint: markdown
            showImage: { type: boolean }
            image:
              type: object
              required: [src, alt]
              properties:
                src: { type: string }
                alt: { type: string }
            action:
              type: object
              properties:
                label: { type: string }
                href: { type: string }
            secondaryAction:
              type: object
              properties:
                label: { type: string }
                href: { type: string }
            formMessages:
              type: object
              required: [pending, success, error]
              properties:
                pending: { type: string }
                success: { type: string }
                error: { type: string }
            items:
              type: array
              items:
                type: object
                properties:
                  title: { type: string }
                  body:
                    type: string
                    x-mcp-hint: markdown
                  icon: { type: string }
            fields:
              type: array
              items:
                type: object
                required: [name, label]
                properties:
                  name: { type: string }
                  label: { type: string }
                  type: { type: string }
                  placeholder: { type: string }
                  autocomplete: { type: string }
                  required: { type: boolean }
                  multiline: { type: boolean }
  uniqueIndexes:
    - [type]
  localized: false
  lifecycle: publishing
---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: home
spec:
  from: page
  fields: [id, type, title, summary, sections, updatedAt]
  filter:
    eq: { field: status, value: published }
  limit: 1
---
apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: reservation-requests
spec:
  title: Reservation requests
  description: Minimal reservation intent capture.
  schema:
    type: object
    required: [name, email, requestedFor]
    properties:
      name:
        type: string
      email:
        type: string
        format: email
      requestedFor:
        type: string
        description: Requested date/time or slot label.
      partySize:
        type: integer
        minimum: 1
      note:
        type: string
  lifecycle: operational
---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: recent-reservation-requests
spec:
  surface: staff
  from: reservation-requests
  fields: [id, name, email, requestedFor, partySize, note, createdAt]
  orderBy:
    - { field: updatedAt, direction: desc }
  limit: 50
---
apiVersion: cms.mantle.aotter.net/v1
kind: Procedure
metadata:
  name: submit-reservation-request
spec:
  input:
    type: object
    additionalProperties: false
    required: [name, email, requestedFor]
    properties:
      name: { type: string }
      email: { type: string, format: email }
      requestedFor: { type: string }
      partySize: { type: integer, minimum: 1 }
      note: { type: string }
  output:
    type: object
  handler:
    kind: builtin
    op: create
    schema: reservation-requests
---
apiVersion: cms.mantle.aotter.net/v1
kind: Trigger
metadata:
  name: submit-reservation-request-http
spec:
  source:
    kind: http
    method: POST
    path: /api/reservation-requests
  target:
    procedure: submit-reservation-request
