---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: home
spec:
  surface: public
  from: page-translations
  params:
    type: object
    additionalProperties: false
    required: [locale]
    properties:
      locale: { type: string }
  fields: [id, slug, locale, title, summary, sections, updatedAt]
  filter:
    and:
      - eq: { field: status, value: published }
      - eq: { field: slug, value: home }
      - eq: { field: locale, value: { $param: locale } }
  limit: 1
---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: public-pages
spec:
  surface: public
  from: page-translations
  params:
    type: object
    additionalProperties: false
    required: [locale]
    properties:
      locale: { type: string }
  fields: [id, slug, locale, title, summary, sections, updatedAt]
  filter:
    and:
      - eq: { field: status, value: published }
      - eq: { field: locale, value: { $param: locale } }
  orderBy:
    - { field: slug, direction: asc }
  limit: 100
---
apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: reservation-requests
spec:
  title: Reservation requests
  description: Minimal reservation intent capture.
  schema:
    type: object
    required: [name, email, requestedFor]
    properties:
      name:
        type: string
      email:
        type: string
        format: email
      requestedFor:
        type: string
        description: Requested date/time or slot label.
      partySize:
        type: integer
        minimum: 1
      note:
        type: string
      createdAt:
        type: integer
        x-mcp-hint: timestamp-ms
        x-mantle-bind: now
  lifecycle: operational
---
apiVersion: cms.mantle.aotter.net/v1
kind: View
metadata:
  name: recent-reservation-requests
spec:
  surface: staff
  from: reservation-requests
  fields: [id, name, email, requestedFor, partySize, note, createdAt]
  orderBy:
    - { field: updatedAt, direction: desc }
  limit: 50
---
apiVersion: cms.mantle.aotter.net/v1
kind: Procedure
metadata:
  name: submit-reservation-request
spec:
  input:
    type: object
    additionalProperties: false
    required: [name, email, requestedFor]
    properties:
      name: { type: string }
      email: { type: string, format: email }
      requestedFor: { type: string }
      partySize: { type: integer, minimum: 1 }
      note: { type: string }
  output:
    type: object
  handler:
    kind: builtin
    op: create
    schema: reservation-requests
---
apiVersion: cms.mantle.aotter.net/v1
kind: Trigger
metadata:
  name: submit-reservation-request-http
spec:
  source:
    kind: http
    method: POST
    path: /api/reservation-requests
  target:
    procedure: submit-reservation-request
