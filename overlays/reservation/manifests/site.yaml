                success: { type: string, title: { en: Success, de: Erfolg, es: Éxito, fr: Succès, id: Berhasil, it: Successo, ja: 成功, ko: 성공, pt-BR: Sucesso, ru: Успешно, zh-CN: 成功, zh-TW: 成功 } }
