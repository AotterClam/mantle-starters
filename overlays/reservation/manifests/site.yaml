        items:
          type: object
          required: [type, title]
          properties:
            type:
              type: string
              enum: [hero, content, form, cta]
              title: { en: Section type, de: Abschnittstyp, es: Tipo de sección, fr: Type de section, id: Jenis bagian, it: Tipo di sezione, ja: セクション種別, ko: 섹션 유형, pt-BR: Tipo de seção, ru: Тип раздела, zh-CN: 区块类型, zh-TW: 區塊類型 }
            id: { type: string, title: { en: ID, de: ID, es: ID, fr: ID, id: ID, it: ID, ja: ID, ko: ID, pt-BR: ID, ru: ID, zh-CN: ID, zh-TW: ID } }
            eyebrow: { type: string, title: { en: Eyebrow, de: Übertitel, es: Antetítulo, fr: Surtitre, id: Teks pengantar, it: Sopratitolo, ja: アイブロウ, ko: 아이브로우, pt-BR: Sobretítulo, ru: Надзаголовок, zh-CN: 引导文字, zh-TW: 引導文字 } }
            title: { type: string, title: { en: Title, de: Titel, es: Título, fr: Titre, id: Judul, it: Titolo, ja: タイトル, ko: 제목, pt-BR: Título, ru: Заголовок, zh-CN: 标题, zh-TW: 標題 } }
            body:
