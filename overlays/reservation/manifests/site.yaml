              properties:
                label: { type: string, title: { en: Label, de: Beschriftung, es: Etiqueta, fr: Libellé, id: Label, it: Etichetta, ja: ラベル, ko: 레이블, pt-BR: Rótulo, ru: Метка, zh-CN: 标签, zh-TW: 標籤 } }
                href: { type: string, title: { en: Link, de: Link, es: Enlace, fr: Lien, id: Tautan, it: Link, ja: リンク, ko: 링크, pt-BR: Link, ru: Ссылка, zh-CN: 链接, zh-TW: 連結 } }
            formMessages:
