apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: page
spec:
  title: { en: Pages, de: Seiten, es: Páginas, fr: Pages, id: Halaman, it: Pagine, ja: ページ, ko: 페이지, pt-BR: Páginas, ru: Страницы, zh-CN: 页面, zh-TW: 頁面 }
  description:
    en: Stable page identities shared by every language version.
    de: Stabile Seitenidentitäten, die von allen Sprachversionen gemeinsam genutzt werden.
    es: Identidades de página estables compartidas por todas las versiones lingüísticas.
    fr: Identités de page stables partagées par toutes les versions linguistiques.
    id: Identitas halaman stabil yang digunakan bersama oleh semua versi bahasa.
    it: Identità di pagina stabili condivise da tutte le versioni linguistiche.
    ja: すべての言語版で共有する安定したページ識別情報です。
    ko: 모든 언어 버전이 공유하는 안정적인 페이지 식별 정보입니다.
    pt-BR: Identidades de página estáveis compartilhadas por todas as versões de idioma.
    ru: Стабильные идентификаторы страниц, общие для всех языковых версий.
    zh-CN: 所有语言版本共享的稳定页面标识数据。
    zh-TW: 所有語言版本共用的穩定頁面識別資料。
  schema:
    type: object
    required: [slug, type]
    properties:
      slug:
        type: string
        pattern: "^[a-z0-9-]+$"
        title: { en: URL slug, de: URL-Slug, es: Slug de URL, fr: Slug d’URL, id: Slug URL, it: Slug URL, ja: URL スラッグ, ko: URL 슬러그, pt-BR: Slug da URL, ru: URL-slug, zh-CN: 网址代称, zh-TW: 網址代稱 }
      type:
        type: string
        enum: [home, page]
        title: { en: Page type, de: Seitentyp, es: Tipo de página, fr: Type de page, id: Jenis halaman, it: Tipo di pagina, ja: ページ種別, ko: 페이지 유형, pt-BR: Tipo de página, ru: Тип страницы, zh-CN: 页面类型, zh-TW: 頁面類型 }
  uniqueIndexes:
    - [slug]
  localized: false
  lifecycle: publishing
---
apiVersion: cms.mantle.aotter.net/v1
kind: Schema
metadata:
  name: page-translations
spec:
  title: { en: Page translations, de: Seitenübersetzungen, es: Traducciones de páginas, fr: Traductions de pages, id: Terjemahan halaman, it: Traduzioni delle pagine, ja: ページ翻訳, ko: 페이지 번역, pt-BR: Traduções de páginas, ru: Переводы страниц, zh-CN: 页面翻译, zh-TW: 頁面翻譯 }
  description:
    en: Localized page copy and sections.
    de: Lokalisierte Seitentexte und Abschnitte.
    es: Textos y secciones de página localizados.
    fr: Textes et sections de page localisés.
    id: Teks dan bagian halaman yang dilokalkan.
    it: Testi e sezioni di pagina localizzati.
    ja: 各言語のページ文言とセクションです。
    ko: 언어별 페이지 문구와 섹션입니다.
    pt-BR: Textos e seções de página localizados.
    ru: Локализованные тексты и разделы страницы.
    zh-CN: 各语言的页面文案和区块。
    zh-TW: 各語言的頁面文案與區塊。
  localized: true
  translates:
    parent: page
    on: slug
  schema:
    type: object
    required: [slug, locale, title, sections]
    properties:
      slug:
        type: string
        pattern: "^[a-z0-9-]+$"
        title: { en: URL slug, de: URL-Slug, es: Slug de URL, fr: Slug d’URL, id: Slug URL, it: Slug URL, ja: URL スラッグ, ko: URL 슬러그, pt-BR: Slug da URL, ru: URL-slug, zh-CN: 网址代称, zh-TW: 網址代稱 }
      locale:
        type: string
        title: { en: Language, de: Sprache, es: Idioma, fr: Langue, id: Bahasa, it: Lingua, ja: 言語, ko: 언어, pt-BR: Idioma, ru: Язык, zh-CN: 语言, zh-TW: 語言 }
      title: { type: string, title: { en: Title, de: Titel, es: Título, fr: Titre, id: Judul, it: Titolo, ja: タイトル, ko: 제목, pt-BR: Título, ru: Заголовок, zh-CN: 标题, zh-TW: 標題 } }
      summary: { type: string, title: { en: Summary, de: Zusammenfassung, es: Resumen, fr: Résumé, id: Ringkasan, it: Riepilogo, ja: 概要, ko: 요약, pt-BR: Resumo, ru: Краткое описание, zh-CN: 摘要, zh-TW: 摘要 } }
