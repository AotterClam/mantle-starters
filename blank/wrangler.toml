name = "mantle-blank"
main = "src/index.ts"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[observability]
enabled = true
head_sampling_rate = 1

[cache]
enabled = true

[vars]
PUBLIC_ORIGIN = "http://localhost:8787"
# Hosted auth:
# MANTLE_PLATFORM_AUTH_ISSUER = "https://platform.mantle.tools/api/auth"
# MANTLE_PLATFORM_AUTH_CLIENT_ID = "..."
# MANTLE_SITE_OWNER_EMAIL = "owner@example.com"
# Self-managed GitHub auth:
# GITHUB_CLIENT_ID = "..."
# ADMIN_GITHUB_LOGIN = "..."
# Secrets stay in Cloudflare via `wrangler secret put`.

[[d1_databases]]
binding = "DB"
database_name = "mantle-blank-local"

[[kv_namespaces]]
binding = "KV"

[[kv_namespaces]]
binding = "OAUTH_KV"
