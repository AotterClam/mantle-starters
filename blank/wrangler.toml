name = "mantle-blank"
main = "src/index.ts"
compatibility_date = "2026-07-31"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[observability]
enabled = true
head_sampling_rate = 1

[cache]
enabled = true

[vars]
PUBLIC_ORIGIN = "http://localhost:8787"
MANTLE_AUTH_MODE = "{{AUTH_MODE}}"
# Mantle Hosted Auth (public PKCE client; no client secret):
# MANTLE_HOSTED_AUTH_ISSUER = "https://auth.mantle.tools"
# MANTLE_HOSTED_AUTH_CLIENT_ID = "https://auth.mantle.tools/clients/<site-id>"
# Self-managed GitHub auth:
# GITHUB_CLIENT_ID = "..."
# ADMIN_GITHUB_LOGIN = "..."
# Secrets stay in Cloudflare via `wrangler secret put`.

[[d1_databases]]
binding = "DB"
database_name = "mantle-blank-local"

[[kv_namespaces]]
binding = "OAUTH_KV"
