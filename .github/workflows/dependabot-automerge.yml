# Auto-merge dependabot PRs after CI passes — but only for patch /
# minor / digest update types. Major bumps stay manual because the
# breaking-change surface is too wide to merge unattended.
#
# Sequencing: `dependabot-lockfile.yml` commits the lockfile fix
# first (which retriggers `validate.yml`). Once validate.yml passes,
# this workflow's `gh pr merge --auto` queues the merge.

name: dependabot-automerge

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Keep approval scoped to the same low-risk updates as auto-merge so a
      # future review rule does not broaden Dependabot's authority.
      # Better Auth must match Core's exact peer. Keep update/security PRs
      # visible, but require coordinated review instead of automatic approval.
      - name: Auto-approve patch + minor + digest
        if: |
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-digest') &&
          !contains(steps.meta.outputs.dependency-names, 'better-auth')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review --approve "$PR_URL"

      - name: Auto-merge patch + minor + digest
        if: |
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-digest') &&
          !contains(steps.meta.outputs.dependency-names, 'better-auth')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Rebase merge keeps develop linear and preserves dependabot's
        # `chore(deps): bump X` subject. Squash is disabled on this repo.
        run: gh pr merge --auto --rebase "$PR_URL"
