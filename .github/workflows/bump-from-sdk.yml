# Release worker for aotter/mantle#559.
#
# Core's release controller dispatches this workflow only after npm publish.
# This worker owns one deterministic Starter transition:
#
#   develop source -> version/locks/skills/bundles -> validated PR -> develop tag
#
# It does not promote main, backport main, or dispatch Landing. Core waits for
# the immutable Starter tag, verifies the published-registry consumer, and
# decides explicitly whether Landing should move.

name: bump-from-sdk

on:
  repository_dispatch:
    types: [sdk-published]

permissions:
  contents: write
  pull-requests: read
  checks: read

concurrency:
  group: bump-from-sdk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: input
        env:
          VERSION: ${{ github.event.client_payload.sdk_version }}
          CORE_SHA: ${{ github.event.client_payload.core_sha }}
          STARTER_SHA: ${{ github.event.client_payload.starter_sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Invalid sdk_version: $VERSION"
            exit 1
          }
          [[ "$CORE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid core_sha: $CORE_SHA"
            exit 1
          }
          [[ "$STARTER_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid starter_sha: $STARTER_SHA"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "core_sha=$CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "starter_sha=$STARTER_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Inspect release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.input.outputs.version }}
          CORE_SHA: ${{ steps.input.outputs.core_sha }}
          STARTER_SHA: ${{ steps.input.outputs.starter_sha }}
        run: |
          set -euo pipefail
          git fetch origin --prune --tags

          CORE_TAG_SHA=$(git ls-remote https://github.com/aotter/mantle.git "refs/tags/v$VERSION^{}" | awk '{print $1}')
          if [ -z "$CORE_TAG_SHA" ]; then
            CORE_TAG_SHA=$(git ls-remote https://github.com/aotter/mantle.git "refs/tags/v$VERSION" | awk '{print $1}')
          fi
          [ "$CORE_TAG_SHA" = "$CORE_SHA" ] || {
            echo "::error::Core v$VERSION resolves to ${CORE_TAG_SHA:-nothing}, not $CORE_SHA"
            exit 1
          }

          MERGED=$(gh pr list --base develop --head "release/v$VERSION" --state merged --limit 10 \
            --json url,mergeCommit,headRepository,headRepositoryOwner,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false and .headRepository.name == "mantle-starters" and .headRepositoryOwner.login == "aotter")]')
          MERGED_COUNT=$(jq 'length' <<< "$MERGED")
          [ "$MERGED_COUNT" -le 1 ] || {
            echo "::error::Multiple canonical release/v$VERSION PRs are merged"
            exit 1
          }
          MERGE_SHA=$(jq -r '.[0].mergeCommit.oid // ""' <<< "$MERGED")

          TAG_SHA=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)
          if [ -n "$TAG_SHA" ]; then
            [ -n "$MERGE_SHA" ] && [ "$TAG_SHA" = "$MERGE_SHA" ] || {
              echo "::error::v$VERSION is not the canonical merged release PR commit"
              exit 1
            }
            echo "mode=tagged" >> "$GITHUB_OUTPUT"
            echo "release_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already exists at $TAG_SHA; duplicate dispatch is a no-op."
            exit 0
          fi

          OPEN=$(gh pr list --base develop --head "release/v$VERSION" --state open --limit 10 \
            --json url,baseRefOid,headRepository,headRepositoryOwner,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false and .headRepository.name == "mantle-starters" and .headRepositoryOwner.login == "aotter")]')
          OPEN_COUNT=$(jq 'length' <<< "$OPEN")
          [ "$OPEN_COUNT" -le 1 ] || {
            echo "::error::Multiple canonical release/v$VERSION PRs are open"
            exit 1
          }
          PR_URL=$(jq -r '.[0].url // ""' <<< "$OPEN")
          if [ -n "$PR_URL" ]; then
            BASE_SHA=$(jq -r '.[0].baseRefOid' <<< "$OPEN")
            [ "$BASE_SHA" = "$STARTER_SHA" ] || {
              echo "::error::Release PR base is $BASE_SHA, not gated Starter $STARTER_SHA; rerun the Core controller"
              exit 1
            }
            echo "mode=open" >> "$GITHUB_OUTPUT"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "Resuming open release PR: $PR_URL"
            exit 0
          fi

          if [ -n "$MERGE_SHA" ]; then
            git fetch origin "$MERGE_SHA"
            git merge-base --is-ancestor "$MERGE_SHA" origin/develop || {
              echo "::error::Recovered release commit $MERGE_SHA is not on develop"
              exit 1
            }
            MERGE_BASE=$(git rev-parse "$MERGE_SHA^1")
            [ "$MERGE_BASE" = "$STARTER_SHA" ] || {
              echo "::error::Release PR merged from $MERGE_BASE, not gated Starter $STARTER_SHA"
              exit 1
            }
            echo "mode=resume" >> "$GITHUB_OUTPUT"
            echo "release_sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"
            echo "Resuming after merged release PR at $MERGE_SHA."
            exit 0
          fi

          ORPHAN_SHA=$(git ls-remote origin "refs/heads/release/v$VERSION" | awk '{print $1}')
          if [ -n "$ORPHAN_SHA" ]; then
            CLOSED=$(gh pr list --base develop --head "release/v$VERSION" --state closed --limit 10 \
              --json url,headRepository,headRepositoryOwner,isCrossRepository \
              --jq '[.[] | select(.isCrossRepository == false and .headRepository.name == "mantle-starters" and .headRepositoryOwner.login == "aotter")] | .[0].url // ""')
            [ -z "$CLOSED" ] || {
              echo "::error::Release branch belongs to closed PR $CLOSED; reopen it or remove the branch explicitly"
              exit 1
            }
            git fetch origin "$ORPHAN_SHA"
            node scripts/check-release-candidate.mjs "$ORPHAN_SHA" "$VERSION" "$CORE_SHA" "$STARTER_SHA"
            echo "mode=orphan" >> "$GITHUB_OUTPUT"
            echo "Resuming release branch $ORPHAN_SHA before PR creation."
            exit 0
          fi

          DEVELOP_SHA=$(git rev-parse origin/develop)
          [ "$DEVELOP_SHA" = "$STARTER_SHA" ] || {
            echo "::error::develop advanced from gated Starter $STARTER_SHA to $DEVELOP_SHA; rerun the Core controller"
            exit 1
          }
          echo "mode=bump" >> "$GITHUB_OUTPUT"

      - name: Prepare release branch
        if: steps.state.outputs.mode == 'bump'
        env:
          VERSION: ${{ steps.input.outputs.version }}
          CORE_SHA: ${{ steps.input.outputs.core_sha }}
        run: |
          set -euo pipefail
          BRANCH="release/v$VERSION"
          git checkout -B "$BRANCH" origin/develop
          echo "branch=$BRANCH" >> "$GITHUB_ENV"
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const version = process.env.VERSION;
            for (const path of ['package.json', 'blank/package.json', 'recipes/typed-web/package.json']) {
              const pkg = JSON.parse(readFileSync(path, 'utf8'));
              for (const section of ['dependencies', 'devDependencies']) {
                for (const name of Object.keys(pkg[section] ?? {})) {
                  if (name === '@aotter/mantle' || name.startsWith('@aotter/mantle-')) pkg[section][name] = version;
                }
              }
              pkg.version = version;
              if (path === 'package.json') pkg.mantleCoreSha = process.env.CORE_SHA;
              writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            }
          "

      - name: Regenerate release artifacts
        if: steps.state.outputs.mode == 'bump'
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          pnpm refresh:starter-locks
          pnpm --dir blank exec mantle skills
          pnpm build:provision-bundle

      - name: Validate release artifacts
        if: steps.state.outputs.mode == 'bump'
        run: |
          set -euo pipefail
          pnpm check:starter-locks
          pnpm check:provision-bundle
          pnpm check:packed

      - name: Commit and push release branch
        if: steps.state.outputs.mode == 'bump'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'mantle-release-bot'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && {
            echo "::error::Release bump produced no changes"
            exit 1
          }
          git commit -m "release: bump @aotter/mantle* to v$VERSION"
          gh auth setup-git
          git push origin "$BRANCH"

      - name: Open release PR
        if: steps.state.outputs.mode == 'bump' || steps.state.outputs.mode == 'orphan'
        id: openpr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_FANOUT_TOKEN }}
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || {
            echo "::error::RELEASE_FANOUT_TOKEN is required to create the release PR"
            exit 1
          }
          BRANCH="release/v$VERSION"
          PR_URL=$(gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "release: bump @aotter/mantle* to v$VERSION" \
            --body "Generated by the Core release controller after published SDK v$VERSION. Locks, Core skills, provision bundles, exact packed Core, and runtime smoke are gated before merge. The merged develop commit becomes the immutable Starter tag; main and Landing are not mutated by this worker.")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Wait for release PR checks
        if: steps.state.outputs.mode == 'bump' || steps.state.outputs.mode == 'orphan' || steps.state.outputs.mode == 'open'
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.openpr.outputs.pr_url || steps.state.outputs.pr_url }}
          VERSION: ${{ steps.input.outputs.version }}
          CORE_SHA: ${{ steps.input.outputs.core_sha }}
          STARTER_SHA: ${{ steps.input.outputs.starter_sha }}
        run: |
          set -euo pipefail
          EXPECTED='["exact packed Core","starter lockfiles","starter safety"]'
          for attempt in $(seq 1 30); do
            CHECKS=$(gh pr checks "$PR_URL" --json name,bucket 2>/dev/null || true)
            FOUND=$(jq --argjson expected "$EXPECTED" '[.[].name] as $names | [$expected[] | select($names | index(.) != null)] | length' <<< "${CHECKS:-[]}")
            [ "$FOUND" = 3 ] && break
            echo "Waiting for release checks to register ($attempt/30; found=$FOUND/3)."
            sleep 5
          done
          [ "${FOUND:-0}" = 3 ] || {
            echo "::error::Expected release checks did not register: $PR_URL"
            exit 1
          }
          gh pr checks "$PR_URL" --watch --fail-fast --interval 10

          PR=$(gh pr view "$PR_URL" --json baseRefOid,headRefOid,headRepository,headRepositoryOwner,isCrossRepository,statusCheckRollup)
          jq -e '.isCrossRepository == false and .headRepository.name == "mantle-starters" and .headRepositoryOwner.login == "aotter"' <<< "$PR" >/dev/null || {
            echo "::error::Refusing non-canonical release PR: $PR_URL"
            exit 1
          }
          BASE_SHA=$(jq -r '.baseRefOid' <<< "$PR")
          [ "$BASE_SHA" = "$STARTER_SHA" ] || {
            echo "::error::Release PR base advanced to $BASE_SHA from gated Starter $STARTER_SHA; rerun the Core controller"
            exit 1
          }
          for NAME in "exact packed Core" "starter lockfiles" "starter safety"; do
            PASSED=$(jq --arg name "$NAME" '[.statusCheckRollup[]? | select(.name == $name and .status == "COMPLETED" and .conclusion == "SUCCESS")] | length' <<< "$PR")
            [ "$PASSED" -ge 1 ] || {
              echo "::error::Required release check did not pass: $NAME"
              exit 1
            }
          done

          HEAD_SHA=$(jq -r '.headRefOid' <<< "$PR")
          git fetch origin "$HEAD_SHA"
          node scripts/check-release-candidate.mjs "$HEAD_SHA" "$VERSION" "$CORE_SHA" "$STARTER_SHA"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Merge checked release head atomically
        if: steps.state.outputs.mode == 'bump' || steps.state.outputs.mode == 'orphan' || steps.state.outputs.mode == 'open'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.input.outputs.version }}
          CORE_SHA: ${{ steps.input.outputs.core_sha }}
          HEAD_SHA: ${{ steps.checks.outputs.head_sha }}
          PR_URL: ${{ steps.openpr.outputs.pr_url || steps.state.outputs.pr_url }}
          STARTER_SHA: ${{ steps.input.outputs.starter_sha }}
        run: |
          set -euo pipefail
          DEVELOP_SHA=$(git ls-remote origin refs/heads/develop | awk '{print $1}')
          [ "$DEVELOP_SHA" = "$STARTER_SHA" ] || {
            echo "::error::develop advanced to $DEVELOP_SHA; rerun the Core controller"
            exit 1
          }
          git config user.name 'mantle-release-bot'
          git config user.email '49699333+dependabot[bot]@users.noreply.github.com'
          git checkout --detach "$STARTER_SHA"
          git merge --no-ff "$HEAD_SHA" -m "Merge release/v$VERSION into develop"
          MERGE_SHA=$(git rev-parse HEAD)
          node scripts/check-release-candidate.mjs "$MERGE_SHA" "$VERSION" "$CORE_SHA" "$STARTER_SHA"
          gh auth setup-git
          git push origin "$MERGE_SHA:refs/heads/develop"
          for attempt in $(seq 1 15); do
            RECORDED_SHA=$(gh pr view "$PR_URL" --json mergeCommit,mergedAt --jq 'select(.mergedAt != null) | .mergeCommit.oid // ""')
            [ "$RECORDED_SHA" = "$MERGE_SHA" ] && break
            sleep 2
          done
          [ "${RECORDED_SHA:-}" = "$MERGE_SHA" ] || {
            echo "::error::GitHub did not record $MERGE_SHA as the release PR merge commit"
            exit 1
          }
          echo "sha=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve release commit
        id: release
        env:
          MODE: ${{ steps.state.outputs.mode }}
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
          RECOVERED_SHA: ${{ steps.state.outputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "$MODE" = bump ] || [ "$MODE" = orphan ] || [ "$MODE" = open ]; then
            SHA="$MERGE_SHA"
          else
            SHA="$RECOVERED_SHA"
          fi
          [[ "${SHA:-}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve Starter release commit"
            exit 1
          }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Create immutable Starter tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.input.outputs.version }}
          CORE_SHA: ${{ steps.input.outputs.core_sha }}
          STARTER_SHA: ${{ steps.input.outputs.starter_sha }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/develop:refs/remotes/origin/develop' --tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/develop || {
            echo "::error::$RELEASE_SHA is not on develop"
            exit 1
          }
          node scripts/check-release-candidate.mjs "$RELEASE_SHA" "$VERSION" "$CORE_SHA" "$STARTER_SHA"
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}" || true)
          if [ -n "$TAG_SHA" ]; then
            [ "$TAG_SHA" = "$RELEASE_SHA" ] || {
              echo "::error::v$VERSION already points to $TAG_SHA, not $RELEASE_SHA"
              exit 1
            }
            echo "v$VERSION already exists at $TAG_SHA; no-op."
          else
            git tag "v$VERSION" "$RELEASE_SHA"
            gh auth setup-git
            git push origin "v$VERSION"
          fi
