name: validate

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  starters:
    name: exact packed Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          path: downstream

      - uses: actions/checkout@v7.0.0
        with:
          repository: aotter/mantle
          ref: 4baf1dab571953c09c4a2906c85816a34e9ca3f4
          path: core

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install Core
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Build Core
        working-directory: core
        run: pnpm build

      - name: Validate exact packed Core in this checkout
        working-directory: core
        run: node scripts/check-packed-consumer.mjs --project ../downstream -- pnpm check:packed

  starter-locks:
    name: starter lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check standalone starter lockfiles
        run: pnpm check:starter-locks

      - name: Check provision bundle is current
        run: pnpm check:provision-bundle

      - name: Smoke provision bundle
        run: pnpm smoke:provision-bundle

      - name: Check Kiwa vendor source is current
        run: pnpm check:kiwa

  starter-safety:
    name: starter safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Assert starter safety checks
        run: |
          node scripts/check-wrangler-dev-wrapper.mjs
          node scripts/check-repo-local-skills.mjs
