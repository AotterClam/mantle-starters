name: validate

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-packed:
    name: Exact packed Core + starters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          path: downstream

      - uses: actions/checkout@v7.0.0
        with:
          repository: aotter/mantle
          ref: develop
          path: core
          fetch-depth: 0

      - name: Use a paired Core branch when one exists
        working-directory: core
        env:
          PAIRED_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$PAIRED_REF" ] && git ls-remote --exit-code origin "refs/heads/$PAIRED_REF" >/dev/null 2>&1; then
            git fetch --depth=1 origin "refs/heads/$PAIRED_REF"
            git checkout --detach FETCH_HEAD
          fi

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install starter build dependencies
        working-directory: downstream
        run: pnpm install --frozen-lockfile

      - name: Check standalone starter lockfiles
        working-directory: downstream
        run: pnpm check:starter-locks

      - name: Check provision bundles are current
        working-directory: downstream
        run: node scripts/build-provision-bundle.mjs --check

      - name: Install Core
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Build Core
        working-directory: core
        run: pnpm build

      - name: Validate the complete starter surface against those artifacts
        working-directory: core
        run: node scripts/run-packed-downstream.mjs --project ../downstream -- pnpm check:exact
