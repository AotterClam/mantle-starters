name: validate

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  starters:
    name: exact packed Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: downstream

      - name: Resolve exact released Core SHA
        id: core
        run: |
          set -euo pipefail
          SHA=$(node -p "require('./downstream/package.json').mantleCoreSha")
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::package.json does not pin an exact Core SHA"
            exit 1
          }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          repository: aotter/mantle
          ref: ${{ steps.core.outputs.sha }}
          path: core

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: core/pnpm-lock.yaml

      - name: Install Core
        working-directory: core
        run: pnpm install --frozen-lockfile

      - name: Build Core
        working-directory: core
        run: pnpm build

      - name: Validate exact packed Core in this checkout
        working-directory: core
        run: node scripts/check-packed-consumer.mjs --project ../downstream -- pnpm check:packed

  starter-locks:
    name: starter lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check standalone starter lockfiles
        run: pnpm check:starter-locks

      - name: Check provision bundle is current
        run: pnpm check:provision-bundle

      # Runtime cold smoke uses the pinned unreleased Core in exact-packed-Core;
      # the registry version may not understand the next Starter grammar yet.
      - name: Check Kiwa vendor source is current
        run: pnpm check:kiwa

  starter-safety:
    name: starter safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Assert starter safety checks
        run: |
          node scripts/check-repo-local-skills.mjs
