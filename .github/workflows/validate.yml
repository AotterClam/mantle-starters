name: validate

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  starters:
    name: starter blank
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: blank/pnpm-lock.yaml

      - name: Install
        working-directory: blank
        run: pnpm install --frozen-lockfile

      - name: Validate manifests
        working-directory: blank
        run: pnpm validate

      - name: Check index coverage
        working-directory: blank
        run: |
          SDK_VERSION=$(node -p "require('./package.json').dependencies['@aotter/mantle']")
          if [ "$SDK_VERSION" = "0.0.11-alpha.62" ]; then
            echo "mantle-harness ships in alpha.63; alpha.62 transition skips this gate."
          else
            pnpm check:indexes
          fi

      - name: Typecheck
        working-directory: blank
        run: pnpm typecheck

  starter-locks:
    name: starter lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check standalone starter lockfiles
        run: pnpm check:starter-locks

      - name: Check provision bundle is current
        run: pnpm check:provision-bundle

      - name: Smoke provision bundle
        run: pnpm smoke:provision-bundle

      - name: Check Kiwa vendor source is current
        run: pnpm check:kiwa

  starter-safety:
    name: starter safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Assert starter safety checks
        run: |
          node scripts/check-wrangler-dev-wrapper.mjs
          node scripts/check-repo-local-skills.mjs
